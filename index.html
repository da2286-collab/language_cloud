<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />,
        users: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>,
        clock: <g><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g>,
        search: <g><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></g>,
        refresh: <g><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></g>,
        checkCircle: <g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>,
        smartphone: <g><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></g>,
        monitor: <g><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></g>,
        send: <g><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g>,
        barChart: <g><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></g>,
        qrCode: <g><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></g>,
        trendingUp: <g><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>,
        messageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>,
        x: <g><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></g>,
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
        info: <g><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></g>,
        share: <g><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></g>,
        trash: <g><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></g>,
        tag: <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/>
      };

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name] || null}
        </svg>
      );
    };

    const INITIAL_FEEDBACKS = [
      {
        id: '1',
        nickname: 'Alex 講者迷',
        content: '今天的 AI 應用案例非常實用，希望未來能多講一些 Prompt 工程與實務操作！',
        timestamp: '14:22:10',
        sentiment: 'positive'
      },
      {
        id: '2',
        nickname: 'Emma 小白',
        content: '希望能有更多互動環節，簡報字體稍微有點小，但整體內容邏輯很清晰！',
        timestamp: '14:23:45',
        sentiment: 'neutral'
      },
      {
        id: '3',
        nickname: 'David 開發者',
        content: '簡報中提到的 LLM 架構圖太棒了，實務範例很有參考價值，收穫滿滿！',
        timestamp: '14:25:02',
        sentiment: 'positive'
      },
      {
        id: '4',
        nickname: ' Chen 學生',
        content: '講師講課節奏緊湊，案例說明生動，希望投影片課後可以分享，謝謝講師！',
        timestamp: '14:26:15',
        sentiment: 'positive'
      },
      {
        id: '5',
        nickname: ' Grace',
        content: 'Prompt 工程的技巧真的很實用，回去工作馬上可以用上！期待下一場進階工作坊。',
        timestamp: '14:27:30',
        sentiment: 'positive'
      },
      {
        id: '6',
        nickname: 'Kevin PM',
        content: '希望實務操作時間能再長一點，現場 QA 時間有點不足，但整體內容很精彩。',
        timestamp: '14:28:11',
        sentiment: 'neutral'
      },
      {
        id: '7',
        nickname: 'Sarah 設計師',
        content: 'UI/UX 與 AI 工具結合的案例非常吸睛！簡報視覺也很美，互動問答環節收穫很多。',
        timestamp: '14:29:40',
        sentiment: 'positive'
      },
      {
        id: '8',
        nickname: ' Leo',
        content: '希望能加入更多產業落地案例與實務操作，演講節奏掌控得很棒！',
        timestamp: '14:31:05',
        sentiment: 'positive'
      }
    ];

    const PRESET_DICTIONARY = [
      { word: 'Prompt工程', category: '技術重點', baseWeight: 8 },
      { word: '實務操作', category: '教學形式', baseWeight: 9 },
      { word: 'AI應用', category: '核心主題', baseWeight: 7 },
      { word: '簡報字體', category: '硬體設施', baseWeight: 4 },
      { word: '互動環節', category: '活動體驗', baseWeight: 6 },
      { word: '內容實用', category: '整體評價', baseWeight: 8 },
      { word: '節奏緊湊', category: '演講風格', baseWeight: 5 },
      { word: '投影片分享', category: '售後服務', baseWeight: 4 },
      { word: 'QA問答', category: '活動體驗', baseWeight: 5 },
      { word: '收穫滿滿', category: '滿意度', baseWeight: 7 },
      { word: '進階工作坊', category: '後續需求', baseWeight: 5 },
      { word: 'LLM架構', category: '技術重點', baseWeight: 4 },
      { word: '落地案例', category: '內容深度', baseWeight: 6 }
    ];

    const WORD_COLORS = [
      'text-indigo-600 border-indigo-200 bg-indigo-50/70 hover:bg-indigo-100',
      'text-violet-600 border-violet-200 bg-violet-50/70 hover:bg-violet-100',
      'text-blue-600 border-blue-200 bg-blue-50/70 hover:bg-blue-100',
      'text-teal-600 border-teal-200 bg-teal-50/70 hover:bg-teal-100',
      'text-emerald-600 border-emerald-200 bg-emerald-50/70 hover:bg-emerald-100',
      'text-rose-600 border-rose-200 bg-rose-50/70 hover:bg-rose-100',
      'text-amber-600 border-amber-200 bg-amber-50/70 hover:bg-amber-100',
      'text-sky-600 border-sky-200 bg-sky-50/70 hover:bg-sky-100',
    ];

    function App() {
      const [viewMode, setViewMode] = useState('presenter');
      const [feedbacks, setFeedbacks] = useState(INITIAL_FEEDBACKS);
      
      const [nickname, setNickname] = useState('');
      const [content, setContent] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [hasSubmitted, setHasSubmitted] = useState(false);
      
      const [selectedKeyword, setSelectedKeyword] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [lastAnalyzedTime, setLastAnalyzedTime] = useState(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
      const [showQrModal, setShowQrModal] = useState(false);
      const [showClearConfirm, setShowClearConfirm] = useState(false);
      const [liveToast, setLiveToast] = useState(null);

      const STOP_WORDS = useMemo(() => new Set([
        '的', '是', '在', '有', '和', '就', '不', '人', '都', '一', '一個', '上', '也', '很', '到', '說', '要', '去', '你', 
        '會', '著', '沒有', '看', '好', '自己', '這', '但是', '可', '能', '希望', '可以', '但', '太', '把', '對', '等', '更',
        '今天', '感覺', '覺得', '一點', '稍微', '包含', '非常', '分享', '謝謝', '講師', '能夠', '大家', '講得'
      ]), []);

      const analyzedKeywords = useMemo(() => {
        if (feedbacks.length === 0) return [];

        const frequencyMap = {};

        PRESET_DICTIONARY.forEach(item => {
          frequencyMap[item.word] = {
            word: item.word,
            category: item.category,
            count: 0,
            weight: item.baseWeight
          };
        });

        feedbacks.forEach(fb => {
          const text = fb.content;

          PRESET_DICTIONARY.forEach(item => {
            if (text.includes(item.word) || 
               (item.word === 'Prompt工程' && text.toLowerCase().includes('prompt')) ||
               (item.word === 'AI應用' && text.toLowerCase().includes('ai'))) {
              frequencyMap[item.word].count += 1;
            }
          });

          const englishWords = text.match(/[A-Za-z0-9+/]{2,}/g) || [];
          englishWords.forEach(word => {
            const clean = word.toUpperCase();
            if (clean.length >= 2 && !STOP_WORDS.has(clean.toLowerCase())) {
              if (!frequencyMap[clean]) {
                frequencyMap[clean] = { word: clean, category: '外來專有名詞', count: 0, weight: 6 };
              }
              frequencyMap[clean].count += 1;
            }
          });

          const cleanedZh = text.replace(/[^\u4e00-\u9fa5]/g, '');
          for (let len = 2; len <= 4; len++) {
            for (let i = 0; i <= cleanedZh.length - len; i++) {
              const phrase = cleanedZh.substring(i, i + len);
              if (!STOP_WORDS.has(phrase) && !Array.from(phrase).some(ch => STOP_WORDS.has(ch))) {
                if (!frequencyMap[phrase]) {
                  frequencyMap[phrase] = { word: phrase, category: '用戶關鍵字', count: 0, weight: 3 };
                }
                frequencyMap[phrase].count += 1;
              }
            }
          }
        });

        return Object.values(frequencyMap)
          .map(item => ({
            ...item,
            totalScore: item.count * 4 + item.weight
          }))
          .filter(item => item.count > 0)
          .sort((a, b) => b.totalScore - a.totalScore)
          .slice(0, 18);
      }, [feedbacks, STOP_WORDS]);

      const { maxScore, minScore } = useMemo(() => {
        if (analyzedKeywords.length === 0) return { maxScore: 10, minScore: 1 };
        const scores = analyzedKeywords.map(k => k.totalScore);
        return {
          maxScore: Math.max(...scores),
          minScore: Math.min(...scores)
        };
      }, [analyzedKeywords]);

      const handleRunAiAnalysis = () => {
        if (feedbacks.length === 0) return;
        setIsAnalyzing(true);
        setTimeout(() => {
          setIsAnalyzing(false);
          setLastAnalyzedTime(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
        }, 600);
      };

      const handleAudienceSubmit = (e) => {
        e.preventDefault();
        if (!content.trim()) return;

        setIsSubmitting(true);
        setTimeout(() => {
          const userNick = nickname.trim() || '熱情聽眾';
          const newFeedback = {
            id: Date.now().toString(),
            nickname: userNick,
            content: content.trim(),
            timestamp: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
            sentiment: content.includes('好') || content.includes('棒') || content.includes('讚') ? 'positive' : 'neutral'
          };

          setFeedbacks(prev => [newFeedback, ...prev]);
          setIsSubmitting(false);
          setHasSubmitted(true);

          setLiveToast(`收到來自「${userNick}」的新意見，後台文字雲已即時同步！`);
          setTimeout(() => setLiveToast(null), 4000);
        }, 500);
      };

      const handleClearAllData = () => {
        setFeedbacks([]);
        setSelectedKeyword(null);
        setShowClearConfirm(false);
        setLiveToast('已清空所有收集數據，會議已重置為 0 筆意見。');
        setTimeout(() => setLiveToast(null), 3000);
      };

      const handleReloadDemoData = () => {
        setFeedbacks(INITIAL_FEEDBACKS);
        setSelectedKeyword(null);
        setLiveToast('已成功載入預設示範資料！');
        setTimeout(() => setLiveToast(null), 3000);
      };

      const handleResetAudienceForm = () => {
        setContent('');
        setHasSubmitted(false);
      };

      const filteredFeedbacks = useMemo(() => {
        return feedbacks.filter(fb => {
          const matchesSearch = searchQuery === '' || 
            fb.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
            fb.nickname.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesKeyword = !selectedKeyword || 
            fb.content.includes(selectedKeyword) ||
            (selectedKeyword === 'Prompt工程' && fb.content.toLowerCase().includes('prompt')) ||
            (selectedKeyword === 'AI應用' && fb.content.toLowerCase().includes('ai'));

          return matchesSearch && matchesKeyword;
        });
      }, [feedbacks, searchQuery, selectedKeyword]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased flex flex-col">
          
          {/* Header Bar */}
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm transition-all">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                  <Icon name="sparkles" className="w-5 h-5 animate-pulse" />
                </div>
                <div>
                  <h1 className="font-bold text-slate-900 text-base sm:text-lg tracking-tight leading-none flex items-center gap-2">
                    即時聽眾意見 AI 文字雲系統
                    <span className="hidden sm:inline-block px-2 py-0.5 text-xs font-semibold bg-indigo-100 text-indigo-700 rounded-full border border-indigo-200">
                      Live & AI Powered
                    </span>
                  </h1>
                  <p className="text-xs text-slate-500 mt-0.5">專為演講研討會打造的即時語意分析工具</p>
                </div>
              </div>

              {/* View Switch Buttons */}
              <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button
                  onClick={() => setViewMode('audience')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    viewMode === 'audience'
                      ? 'bg-white text-indigo-600 shadow-sm font-bold'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                  }`}
                >
                  <Icon name="smartphone" className="w-3.5 h-3.5" />
                  <span>聽眾手機端</span>
                </button>

                <button
                  onClick={() => setViewMode('presenter')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    viewMode === 'presenter'
                      ? 'bg-white text-indigo-600 shadow-sm font-bold'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                  }`}
                >
                  <Icon name="monitor" className="w-3.5 h-3.5" />
                  <span>講師後台儀表板</span>
                </button>
              </div>

            </div>
          </header>

          {/* Toast Notification */}
          {liveToast && (
            <div className="fixed top-16 right-4 z-50 bg-slate-900/90 backdrop-blur-md text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="zap" className="w-4 h-4 text-amber-400" />
              <span>{liveToast}</span>
            </div>
          )}

          {}
          <main className="flex-1 flex flex-col">
            {viewMode === 'audience' ? (
              /* AUDIENCE MOBILE INPUT VIEW */
              <div className="flex-1 flex items-center justify-center p-4 sm:p-6 bg-slate-100">
                <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden transition-all">
                  
                  <div className="bg-gradient-to-r from-indigo-600 via-indigo-700 to-violet-700 p-6 text-white relative overflow-hidden">
                    <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none" />
                    <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/15 backdrop-blur-md text-white text-xs font-medium mb-3 border border-white/20">
                      <Icon name="messageSquare" className="w-3.5 h-3.5 text-indigo-200" />
                      <span>2026 AI 趨勢論壇 - 聽眾即時反饋</span>
                    </div>
                    <h2 className="text-xl font-bold tracking-tight">發表您的現場意見</h2>
                    <p className="text-indigo-100 text-xs mt-1 leading-relaxed">
                      您的回饋將透過 AI 即時轉化為主題文字雲，於現場投影幕同步呈現！
                    </p>
                  </div>

                  <div className="p-6">
                    {hasSubmitted ? (
                      <div className="text-center py-8 space-y-4">
                        <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                          <Icon name="checkCircle" className="w-10 h-10" />
                        </div>
                        <div>
                          <h3 className="text-lg font-bold text-slate-800">感謝您的意見回饋！</h3>
                          <p className="text-sm text-slate-500 mt-1 max-w-xs mx-auto">
                            您的留言已成功送出，講師正透過文字雲即時檢視大家的精彩觀點。
                          </p>
                        </div>

                        <div className="pt-4 flex flex-col gap-2">
                          <button
                            onClick={handleResetAudienceForm}
                            className="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-200 transition active:scale-95 flex items-center justify-center gap-2"
                          >
                            <Icon name="send" className="w-4 h-4" />
                            再次提交其他意見
                          </button>
                        </div>
                      </div>
                    ) : (
                      <form onSubmit={handleAudienceSubmit} className="space-y-4">
                        <div>
                          <label htmlFor="nickname" className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                            您的暱稱 <span className="text-slate-400 font-normal">(選填)</span>
                          </label>
                          <input
                            type="text"
                            id="nickname"
                            value={nickname}
                            onChange={(e) => setNickname(e.target.value)}
                            placeholder="例如：Alex、現場聽眾..."
                            maxLength={20}
                            className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition placeholder:text-slate-400"
                          />
                        </div>

                        <div>
                          <label htmlFor="content" className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                            一句話或想法回饋 <span className="text-rose-500">*</span>
                          </label>
                          <textarea
                            id="content"
                            required
                            rows={4}
                            value={content}
                            onChange={(e) => setContent(e.target.value)}
                            placeholder="請分享您對今天演講的看法、收穫或疑問，例如：今天的 Prompt 工程案例很實用，希望能有更多範例..."
                            className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition placeholder:text-slate-400 resize-none"
                          />
                          <div className="flex justify-between items-center mt-1">
                            <span className="text-[11px] text-slate-400">支援完整句子或多行段落輸入</span>
                            <span className="text-[11px] text-slate-400">{content.length}/200</span>
                          </div>
                        </div>

                        <button
                          type="submit"
                          disabled={isSubmitting || !content.trim()}
                          className="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition disabled:opacity-50 disabled:cursor-not-allowed active:scale-95 flex items-center justify-center gap-2"
                        >
                          {isSubmitting ? (
                            <>
                              <Icon name="refresh" className="w-4 h-4 animate-spin" />
                              <span>AI 分析傳送中...</span>
                            </>
                          ) : (
                            <>
                              <Icon name="send" className="w-4 h-4" />
                              <span>提交意見至大螢幕</span>
                            </>
                          )}
                        </button>
                      </form>
                    )}
                  </div>

                  <div className="bg-slate-50 px-6 py-3 border-t border-slate-100 text-center">
                    <p className="text-[11px] text-slate-400 flex items-center justify-center gap-1">
                      <Icon name="zap" className="w-3 h-3 text-amber-500" />
                      即時自動去識別化處理，並進行 AI 自然語言語意分析
                    </p>
                  </div>

                </div>
              </div>
            ) : (
              <div className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">
                
                {/* KPI Metrics */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 tracking-wider uppercase">收集意見總數</p>
                      <div className="flex items-baseline gap-2 mt-1">
                        <span className="text-3xl font-extrabold text-slate-900 tracking-tight">{feedbacks.length}</span>
                        <span className="text-xs font-medium text-emerald-600 flex items-center">
                          <Icon name="trendingUp" className="w-3 h-3 mr-0.5" /> 即時連動
                        </span>
                      </div>
                    </div>
                    <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                      <Icon name="users" className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 tracking-wider uppercase">最新提交時間</p>
                      <p className="text-2xl font-bold text-slate-900 mt-1 font-mono tracking-tight">
                        {feedbacks[0]?.timestamp || '無資料'}
                      </p>
                    </div>
                    <div className="p-3 bg-amber-50 text-amber-600 rounded-xl">
                      <Icon name="clock" className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 tracking-wider uppercase">AI 分析關鍵字</p>
                      <div className="flex items-baseline gap-2 mt-1">
                        <span className="text-3xl font-extrabold text-slate-900 tracking-tight">{analyzedKeywords.length}</span>
                        <span className="text-xs text-slate-400">個核心主題</span>
                      </div>
                    </div>
                    <div className="p-3 bg-violet-50 text-violet-600 rounded-xl">
                      <Icon name="sparkles" className="w-6 h-6" />
                    </div>
                  </div>

                  <div 
                    onClick={() => setShowQrModal(true)}
                    className="bg-gradient-to-br from-indigo-600 to-violet-700 p-5 rounded-2xl shadow-sm text-white flex items-center justify-between cursor-pointer hover:opacity-95 transition group"
                  >
                    <div>
                      <div className="flex items-center gap-1.5 text-indigo-200 text-xs font-semibold uppercase tracking-wider">
                        <Icon name="qrCode" className="w-3.5 h-3.5" />
                        <span>聽眾掃描入口</span>
                      </div>
                      <p className="text-sm font-bold mt-1 group-hover:underline">點擊放大 QR Code 投螢幕</p>
                    </div>
                    <div className="p-2.5 bg-white/20 backdrop-blur-md rounded-xl text-white">
                      <Icon name="share" className="w-5 h-5" />
                    </div>
                  </div>

                </div>

                {}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-lg overflow-hidden flex flex-col">
                  
                  <div className="p-5 border-b border-slate-100 bg-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <div className="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
                        <Icon name="barChart" className="w-5 h-5" />
                      </div>
                      <div>
                        <h2 className="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                          AI 語意文字雲 (Semantic Word Cloud)
                          {selectedKeyword && (
                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800 border border-indigo-200">
                              篩選: {selectedKeyword}
                              <button onClick={() => setSelectedKeyword(null)} className="hover:text-indigo-950">
                                <Icon name="x" className="w-3 h-3" />
                              </button>
                            </span>
                          )}
                        </h2>
                        <p className="text-xs text-slate-500">關聯度與提及次數越高，字體越大；點擊詞彙可過濾對應聽眾留言</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 flex-wrap w-full sm:w-auto">
                      {selectedKeyword && (
                        <button
                          onClick={() => setSelectedKeyword(null)}
                          className="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-xl transition flex items-center gap-1"
                        >
                          <Icon name="x" className="w-3.5 h-3.5" />
                          清除選取
                        </button>
                      )}

                      {feedbacks.length > 0 ? (
                        <button
                          onClick={() => setShowClearConfirm(true)}
                          className="px-3 py-1.5 text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl transition flex items-center gap-1"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                          清空意見 (重置)
                        </button>
                      ) : (
                        <button
                          onClick={handleReloadDemoData}
                          className="px-3 py-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl transition flex items-center gap-1"
                        >
                          <Icon name="refresh" className="w-3.5 h-3.5" />
                          載入預設範例
                        </button>
                      )}

                      <button
                        onClick={handleRunAiAnalysis}
                        disabled={isAnalyzing || feedbacks.length === 0}
                        className="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 border border-indigo-200 disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <Icon name="refresh" className={`w-3.5 h-3.5 ${isAnalyzing ? 'animate-spin text-indigo-600' : ''}`} />
                        <span>{isAnalyzing ? 'AI 分析運算中...' : '重新計算 AI 權重'}</span>
                      </button>
                    </div>
                  </div>

                  {/* Pure White Background Word Cloud Canvas */}
                  <div className="relative min-h-[360px] sm:min-h-[420px] bg-white p-8 sm:p-12 flex items-center justify-center overflow-hidden">
                    
                    <div className="absolute inset-0 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none" />

                    {isAnalyzing ? (
                      <div className="flex flex-col items-center justify-center space-y-3 z-10 py-12">
                        <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin" />
                        <p className="text-sm font-semibold text-slate-600 animate-pulse">
                          AI 語意模型正在進行句子切詞與權重歸納...
                        </p>
                      </div>
                    ) : analyzedKeywords.length === 0 ? (
                      <div className="text-center py-12 text-slate-400 space-y-3">
                        <Icon name="info" className="w-10 h-10 mx-auto text-slate-300" />
                        <p className="text-sm font-medium">目前無意見資料，請切換至「聽眾手機端」送出留言，或點擊「載入預設範例」</p>
                        <button
                          onClick={handleReloadDemoData}
                          className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow transition hover:bg-indigo-700"
                        >
                          載入示範數據
                        </button>
                      </div>
                    ) : (
                      <div className="relative z-10 w-full max-w-4xl flex flex-wrap items-center justify-center gap-3 sm:gap-5 leading-relaxed py-4">
                        {analyzedKeywords.map((item, index) => {
                          const norm = (item.totalScore - minScore) / (maxScore - minScore || 1);
                          const fontSizePx = Math.round(14 + norm * 34); 
                          
                          const colorStyle = WORD_COLORS[index % WORD_COLORS.length];
                          const isSelected = selectedKeyword === item.word;

                          return (
                            <button
                              key={item.word}
                              onClick={() => setSelectedKeyword(isSelected ? null : item.word)}
                              style={{ fontSize: `${fontSizePx}px` }}
                              className={`group relative inline-flex items-center gap-1.5 font-bold transition-all duration-300 rounded-2xl px-3.5 py-1.5 border ${colorStyle} ${
                                isSelected 
                                  ? 'ring-4 ring-indigo-500/30 scale-110 z-20 font-black shadow-lg' 
                                  : 'hover:scale-105 hover:shadow-md hover:z-10'
                              }`}
                            >
                              <span className="tracking-tight">{item.word}</span>
                              <span className="text-[10px] font-mono font-semibold px-1.5 py-0.5 rounded-full bg-white/80 border border-slate-200 text-slate-700 opacity-80 group-hover:opacity-100">
                                {item.count}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    <div className="absolute bottom-3 right-4 text-[11px] text-slate-400 font-mono">
                      上次 AI 歸納時間: {lastAnalyzedTime}
                    </div>
                  </div>

                </div>

                {}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
                  
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                        <Icon name="messageSquare" className="w-4 h-4 text-indigo-600" />
                        聽眾即時反饋動態清單
                        <span className="text-xs font-normal text-slate-500">
                          (共 {filteredFeedbacks.length} 筆留言)
                        </span>
                      </h3>
                      <p className="text-xs text-slate-500 mt-0.5">現場聽眾提交的完整長句子與觀點</p>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="搜尋暱稱或留言關鍵字..."
                        className="w-full pl-9 pr-8 py-1.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                      />
                      {searchQuery && (
                        <button 
                          onClick={() => setSearchQuery('')}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                        >
                          <Icon name="x" className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 pt-2">
                    {filteredFeedbacks.length === 0 ? (
                      <div className="col-span-full py-8 text-center text-slate-400 text-sm">
                        未找到符合條件的聽眾留言
                      </div>
                    ) : (
                      filteredFeedbacks.map((fb) => (
                        <div 
                          key={fb.id} 
                          className="p-4 rounded-2xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 transition flex flex-col justify-between space-y-3"
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center gap-2">
                              <div className="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">
                                {fb.nickname.charAt(0)}
                              </div>
                              <span className="text-xs font-bold text-slate-800">{fb.nickname}</span>
                            </div>
                            <span className="text-[11px] font-mono text-slate-400">{fb.timestamp}</span>
                          </div>

                          <p className="text-xs text-slate-700 leading-relaxed font-medium">
                            {fb.content}
                          </p>

                          <div className="flex items-center justify-between pt-1 border-t border-slate-100/80">
                            <span className="inline-flex items-center gap-1 text-[10px] text-slate-400">
                              <Icon name="tag" className="w-3 h-3 text-slate-300" />
                              已納入 AI 權重計算
                            </span>
                            <span className="text-[10px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">
                              即時傳輸
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                </div>

              </div>
            )}
          </main>

          {}
          {showClearConfirm && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl relative text-center">
                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto">
                  <Icon name="trash" className="w-6 h-6" />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-slate-900">確定要清空所有收集意見？</h3>
                  <p className="text-xs text-slate-500 mt-1">此動作將重置聽眾人數為 0 筆，清空目前的文字雲。您可以重新讓手機端填寫或重新載入範例。</p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setShowClearConfirm(false)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition"
                  >
                    取消
                  </button>
                  <button
                    onClick={handleClearAllData}
                    className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl transition shadow"
                  >
                    確認清空
                  </button>
                </div>
              </div>
            </div>
          )}

          {showQrModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center space-y-5 shadow-2xl relative">
                <button 
                  onClick={() => setShowQrModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 bg-slate-100 rounded-full"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="space-y-1">
                  <h3 className="text-xl font-bold text-slate-900">掃描提交意見</h3>
                  <p className="text-xs text-slate-500">請聽眾使用手機相機掃描 QR Code 進入網頁</p>
                </div>

                <div className="w-56 h-56 mx-auto bg-slate-900 p-4 rounded-2xl flex flex-col items-center justify-center text-white shadow-inner">
                  <Icon name="qrCode" className="w-40 h-40 text-white" />
                  <p className="text-[10px] text-slate-400 font-mono mt-2">https://cloud-feedback.live</p>
                </div>

                <button
                  onClick={() => {
                    setShowQrModal(false);
                    setViewMode('audience');
                  }}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition"
                >
                  模擬聽眾手機端開啟
                </button>
              </div>
            </div>
          )}

          <footer className="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-400">
            AI Audience Feedback & Word Cloud System &copy; 2026 Presentation Tools
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
